services:
  - type: web
    name: w2-w2c-generator
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
    # Note: Free tier has 30s request timeout limit
    # For very large requests (>50k employees), consider using the CLI tool locally
    # or upgrading to a paid plan for longer timeouts

